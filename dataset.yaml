# Training data paths (relative to where you run the 'yolo' command)
path: ./datasets  # Root directory of the dataset (contains images/ and labels/)
train: images/train  # Path to training images (relative to 'path')
val: images/val    # Path to validation images (relative to 'path')
# test: images/test # Optional: Path to test images (relative to 'path')

# Class names
names:
  0: License Plate # Use the name you want for display/output
                   # The ID 0 matches what voc_to_yolo.py used.